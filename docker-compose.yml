services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yara}
      POSTGRES_DB: ${POSTGRES_DB:-yara}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yara} -d ${POSTGRES_DB:-yara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yara}:${POSTGRES_PASSWORD:-yara}@postgres:5432/${POSTGRES_DB:-yara}
      YARA_HOST: "0.0.0.0"
      YARA_PORT: "${YARA_PORT:-3000}"
      SQLX_OFFLINE: "true"
    ports:
      - "${YARA_PORT:-3001}:3000"
    volumes:
      - ./backend:/app
      - backend_cargo_registry:/usr/local/cargo/registry
      - backend_target:/app/target
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY_TARGET: "http://backend:${YARA_PORT:-3000}"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_cargo_registry:
  backend_target:
  frontend_node_modules:
