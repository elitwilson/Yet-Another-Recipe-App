services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yara}
      POSTGRES_DB: ${POSTGRES_DB:-yara}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
