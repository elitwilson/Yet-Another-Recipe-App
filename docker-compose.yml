services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yara}
      POSTGRES_DB: ${POSTGRES_DB:-yara}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yara} -d ${POSTGRES_DB:-yara}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-yara}:${POSTGRES_PASSWORD:-yara}@postgres:5432/${POSTGRES_DB:-yara}
      YARA_HOST: "0.0.0.0"
      YARA_PORT: "${YARA_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
