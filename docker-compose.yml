services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yara}
      POSTGRES_DB: ${POSTGRES_DB:-yara}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yara} -d ${POSTGRES_DB:-yara}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
