server {
    listen 80;
    root /usr/share/nginx/html;
    index 200.html;

    # Proxy /api to the backend service (mirrors Vite dev proxy in vite.config.ts)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — required because the frontend is a client-side router (ssr=false)
    location / {
        try_files $uri $uri/ /200.html;
    }
}
